<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cronômetro</title>
  <meta name="description"
    content="Viewer p&#250;blico do Cron&#244;metro Sync para acompanhar as contagens sincronizadas em tempo real." />
  <meta name="application-name" content="Cron&#244;metro Sync" />
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
  <link rel="canonical" href="__CANONICAL_URL__" />
  <link rel="icon" type="image/png" sizes="16x16" href="/assets/img/favicon-16.png" />
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/img/favicon-32.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/assets/img/apple-touch-icon.png" />
  <meta property="og:type" content="website" />
  <meta property="og:locale" content="pt_BR" />
  <meta property="og:site_name" content="Cron&#244;metro Sync" />
  <meta property="og:title" content="Cron&#244;metro Sync - Viewer" />
  <meta property="og:description" content="Acompanhe os cron&#244;metros em uma tela limpa, sem controles." />
  <meta property="og:url" content="__CANONICAL_URL__" />
  <meta property="og:image" content="__OG_IMAGE_URL__" />
  <meta property="og:image:width" content="512" />
  <meta property="og:image:height" content="512" />
  <meta name="twitter:card" content="summary" />

  <link rel="stylesheet" href="__ASSET:css/tokens.css__" />
  <link rel="stylesheet" href="__ASSET:css/base.css__" />
  <link rel="stylesheet" href="__ASSET:css/viewer.css__" />
  <script src="/socket.io/socket.io.js"></script>
</head>

<body>
  <div class="link-status" id="link-status" hidden aria-live="polite"></div>

  <main class="viewer">
    <section class="viewer-main" id="viewer-primary" hidden>
      <header class="viewer-head">
        <span class="viewer-label" id="viewer-primary-label"></span>
        <span class="status-pill" id="viewer-state" hidden></span>
      </header>

      <div class="timer-digits viewer-time" id="viewer-primary-time">--:--:--</div>

      <div class="progress viewer-bar">
        <div class="progress-fill" id="viewer-primary-progress"></div>
      </div>

      <p class="viewer-meta" id="viewer-primary-meta"></p>
    </section>

    <section class="viewer-others" id="viewer-secondaries" data-count="0" aria-label="Outros cronômetros" hidden>
    </section>

    <p class="screen-message" id="viewer-message">Aguardando cronômetros…</p>
  </main>

  <template id="viewer-card-template">
    <article class="viewer-card">
      <span class="viewer-card-label"></span>
      <span class="timer-digits viewer-card-time">--:--:--</span>
      <div class="progress">
        <div class="progress-fill"></div>
      </div>
    </article>
  </template>

  <script src="__ASSET:js/crono-utils.js__"></script>
  <script src="__ASSET:js/finish-sound.js__"></script>
  <script src="__ASSET:js/viewer.js__"></script>
</body>

</html>
